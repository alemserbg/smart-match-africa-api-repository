name: Sync to Hugging Face Hub

on:
  push:
    branches: [main] # Change to 'master' if your default branch is master

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        uses: huggingface/github-action@v6
        with:
          token: ${{ secrets.HF_ACCESS_TOKEN }}
          space: alemserbg/smart-match-africa
          git_user_name: alemserbg
          git_user_email: alemserbg@gmail.com
          branch: main
