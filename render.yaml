version: "1"

services:
  # ==========================================
  # UNIFIED FASTAPI & TELETHON GATEWAY (main.py)
  # ==========================================
  - type: web
    name: smart-match-africa-gateway
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.smartmatch.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG_MODE
        value: "false"
      - key: SERVER_PORT
        value: "10000"
      - key: PRODUCTION_API_URL
        value: "https://smart-match-africa-gateway-ijg3.onrender.com"

      # Core Telegram & AI Credentials (Required by config.py)
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # Chapa Payment Integration (Required by config.py)
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false

      # Supabase Cloud Infrastructure (Required by config.py)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # Database & Backblaze B2 Storage (Required by config.py)
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: B2_ENDPOINT_URL
        sync: false

      # Telethon Userbot Credentials (Optional)
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: TELETHON_SESSION_STRING
        sync: false
      - key: TRACKER_PHONE_NUMBER
        value: "+251922707554"